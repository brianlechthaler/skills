# Reviewed SkillSpector suppressions for cloud-init.
# Applied in CI via scripts/run_skillspector.py --use-shipped-baseline.
version: 2
scanner_version: "2.13.1"
rules:
  - id: "AE1"
    reason: >-
      examples.md hits SkillSpector static parse span limits on long cloud-config
      templates; this is a coverage gap in the scanner, not analysis evasion.
      Templates are first-party ops documentation reviewed for this skill.
